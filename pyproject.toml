[project]
name = "aetherloom"
version = "0.2.0"
description = "Aetherloom local world workspace"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "markdown-it-py>=4.2.0",
    "pillow>=12.3.0",
    "pypdf>=6.19.0",
    "pypdfium2>=5.14.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn>=0.34,<1",
    "winrt-windows-foundation>=3.2.1 ; sys_platform == 'win32'",
    "winrt-windows-foundation-collections>=3.2.1 ; sys_platform == 'win32'",
    "winrt-windows-globalization>=3.2.1 ; sys_platform == 'win32'",
    "winrt-windows-graphics-imaging>=3.2.1 ; sys_platform == 'win32'",
    "winrt-windows-media-ocr>=3.2.1 ; sys_platform == 'win32'",
    "winrt-windows-storage-streams>=3.2.1 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
